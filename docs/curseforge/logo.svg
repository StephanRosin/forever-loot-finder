<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#2a3346"/>
      <stop offset="0.6" stop-color="#151a26"/>
      <stop offset="1" stop-color="#0a0d14"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2b0"/>
      <stop offset="0.35" stop-color="#e8c25a"/>
      <stop offset="0.7" stop-color="#a87a22"/>
      <stop offset="1" stop-color="#6e4c12"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5228"/>
      <stop offset="1" stop-color="#4a2810"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5663a"/>
      <stop offset="1" stop-color="#5e3416"/>
    </linearGradient>
    <radialGradient id="lens" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#3a4a66" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#111827" stop-opacity="0.95"/>
    </radialGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6b8ff"/>
      <stop offset="0.5" stop-color="#a335ee"/>
      <stop offset="1" stop-color="#4a1080"/>
    </linearGradient>
    <radialGradient id="shine" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe9a0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffca30" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.7"/>
    </filter>
    <clipPath id="lidclip"><path d="M64 252 L64 214 C64 168 112 146 200 146 C288 146 336 168 336 214 L336 252 Z"/></clipPath>
    <clipPath id="inlens"><circle cx="334" cy="196" r="88"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="72" fill="url(#bg)"/>

  <!-- treasure chest -->
  <g filter="url(#shadow)">
    <!-- glow from the open lid -->
    <ellipse cx="200" cy="262" rx="130" ry="34" fill="url(#shine)"/>
    <!-- lid, slightly open -->
    <path d="M64 252 L64 214 C64 168 112 146 200 146 C288 146 336 168 336 214 L336 252 Z"
          fill="url(#lid)" stroke="#2a1606" stroke-width="5" stroke-linejoin="round"/>
    <path d="M64 240 L336 240 L336 254 L64 254 Z" fill="url(#gold)"/>
    <g clip-path="url(#lidclip)">
      <rect x="96" y="140" width="22" height="114" fill="url(#gold)"/>
      <rect x="282" y="140" width="22" height="114" fill="url(#gold)"/>
    </g>
    <path d="M64 252 L64 214 C64 168 112 146 200 146 C288 146 336 168 336 214 L336 252 Z" fill="none" stroke="#2a1606" stroke-width="5" stroke-linejoin="round"/>
    <!-- coins in the gap -->
    <rect x="70" y="256" width="260" height="18" fill="#1a0e04"/>
    <g fill="url(#gold)" stroke="#6e4c12" stroke-width="2">
      <ellipse cx="120" cy="266" rx="20" ry="9"/>
      <ellipse cx="164" cy="262" rx="20" ry="9"/>
      <ellipse cx="214" cy="266" rx="20" ry="9"/>
      <ellipse cx="262" cy="262" rx="20" ry="9"/>
      <ellipse cx="304" cy="266" rx="18" ry="8"/>
    </g>
    <!-- body -->
    <rect x="60" y="272" width="280" height="148" rx="8" fill="url(#wood)" stroke="#2a1606" stroke-width="5"/>
    <path d="M64 318 H336 M64 368 H336" stroke="#3a1e08" stroke-width="4" opacity="0.8"/>
    <rect x="96" y="274" width="22" height="144" fill="url(#gold)"/>
    <rect x="282" y="274" width="22" height="144" fill="url(#gold)"/>
    <rect x="60" y="272" width="280" height="14" fill="url(#gold)"/>
    <!-- lock -->
    <rect x="176" y="290" width="48" height="58" rx="8" fill="url(#gold)" stroke="#6e4c12" stroke-width="3"/>
    <circle cx="200" cy="312" r="7" fill="#2a1606"/>
    <path d="M200 316 L200 334" stroke="#2a1606" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- magnifier -->
  <g filter="url(#shadow)">
    <!-- handle -->
    <path d="M398 262 L458 322" stroke="#6e4c12" stroke-width="40" stroke-linecap="round"/>
    <path d="M412 276 L460 324" stroke="#3a2210" stroke-width="30" stroke-linecap="round"/>
    <path d="M420 284 L456 320" stroke="#7a4a22" stroke-width="20" stroke-linecap="round"/>
    <!-- glass -->
    <circle cx="334" cy="196" r="88" fill="url(#lens)"/>
    <g clip-path="url(#inlens)">
      <circle cx="334" cy="196" r="70" fill="url(#shine)" opacity="0.6"/>
      <!-- magnified gem -->
      <g transform="translate(334 200)">
        <path d="M-44 -18 L-24 -42 L24 -42 L44 -18 L0 44 Z" fill="url(#gem)" stroke="#2a0848" stroke-width="4" stroke-linejoin="round"/>
        <path d="M-44 -18 H44 M-24 -42 L-12 -18 L0 44 M24 -42 L12 -18 L0 44 M-12 -18 L0 -42 L12 -18"
              fill="none" stroke="#2a0848" stroke-width="2.5" opacity="0.6" stroke-linejoin="round"/>
        <path d="M-30 -22 L-20 -36" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
      </g>
      <!-- glass reflection -->
      <path d="M272 168 A68 68 0 0 1 318 126" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.35"/>
    </g>
    <!-- rim -->
    <circle cx="334" cy="196" r="88" fill="none" stroke="url(#gold)" stroke-width="18"/>
    <circle cx="334" cy="196" r="97" fill="none" stroke="#3a2708" stroke-width="2"/>
    <circle cx="334" cy="196" r="79" fill="none" stroke="#3a2708" stroke-width="2"/>
  </g>

  <!-- sparkles -->
  <g fill="#ffe9a0">
    <path d="M118 100 l6 18 18 6 -18 6 -6 18 -6 -18 -18 -6 18 -6 Z"/>
    <path d="M440 98 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4 Z" opacity="0.8"/>
  </g>
</svg>
